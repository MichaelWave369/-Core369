name: Photonics R0-P3 CPU simulation smoke

on:
  pull_request:
    paths:
      - 'scripts/photonics-r0.py'
      - 'scripts/photonics-p1.py'
      - 'scripts/photonics-p2.py'
      - 'scripts/compare-photonics-p3.mjs'
      - 'src/photonics.js'
      - 'src/photonics-hybrid.js'
      - 'src/photonics-p2.js'
      - 'src/photonics-p3.js'
      - 'tests/test_photonics_r0.py'
      - 'tests/test_photonics_p1.py'
      - 'tests/test_photonics_p2.py'
      - 'tests/photonics.test.mjs'
      - 'tests/photonics-hybrid.test.mjs'
      - 'tests/photonics-p2.test.mjs'
      - 'tests/photonics-p3.test.mjs'
      - '.github/workflows/photonics-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/photonics-r0.py'
      - 'scripts/photonics-p1.py'
      - 'scripts/photonics-p2.py'
      - 'scripts/compare-photonics-p3.mjs'
      - 'src/photonics.js'
      - 'src/photonics-hybrid.js'
      - 'src/photonics-p2.js'
      - 'src/photonics-p3.js'
      - 'tests/test_photonics_r0.py'
      - 'tests/test_photonics_p1.py'
      - 'tests/test_photonics_p2.py'
      - 'tests/photonics.test.mjs'
      - 'tests/photonics-hybrid.test.mjs'
      - 'tests/photonics-p2.test.mjs'
      - 'tests/photonics-p3.test.mjs'
      - '.github/workflows/photonics-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-photonics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only PyTorch
        run: python -m pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
      - name: CPU numerical unit tests
        run: python -m unittest discover -s tests -p 'test_photonics*.py' -v
      - name: Generate one bounded JSON report
        run: python scripts/photonics-r0.py --device cpu --samples 64 --nodes 8 --repeats 1 --out photonics-smoke.json
      - name: Validate emitted JSON against browser importer
        run: |
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import {parsePhotonicsReport} from './src/photonics.js'; parsePhotonicsReport(readFileSync('photonics-smoke.json','utf8')); console.log('Simulation report schema valid')"
      - name: Generate P1 CPU-only report (no GPU invented)
        run: python scripts/photonics-p1.py --device cpu --samples 128 --nodes 16 --repeats 1 --out photonics-p1-smoke.json
      - name: Validate P1 emitted report
        run: |
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import {parseHybridReport} from './src/photonics-hybrid.js'; const report=parseHybridReport(readFileSync('photonics-p1-smoke.json','utf8')); if (report.environment.device !== 'cpu') throw Error('Unexpected GPU'); console.log('Hybrid P1 CPU JSON accepted');"
      - name: Generate P2 CPU paired trials
        run: python scripts/photonics-p2.py --device cpu --samples 64 --steps 8 --nodes 8 --repeats 3 --out photonics-p2-smoke.json
      - name: Validate emitted P2 report in JavaScript
        run: |
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import {parsePhotonicsP2} from './src/photonics-p2.js'; const r=parsePhotonicsP2(readFileSync('photonics-p2-smoke.json','utf8')); if (r.environment.device !== 'cpu' || Object.keys(r.tasks).length !== 2) throw Error('Invalid P2 CPU smoke'); console.log('P2 CPU report accepted');"
      - name: Generate second independent P2 CPU report
        run: python scripts/photonics-p2.py --device cpu --samples 64 --steps 8 --nodes 8 --repeats 3 --out photonics-p2-repeat.json
      - name: Compare two CPU P2 runs with P3 CLI
        run: |
          node scripts/compare-photonics-p3.mjs photonics-p2-smoke.json photonics-p2-repeat.json > /dev/null
